version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vision_ngo
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/vision_ngo
      PORT: 4000
      JWT_SECRET: dev-secret
    ports:
      - '4000:4000'
    depends_on:
      - db

volumes:
  db_data:
